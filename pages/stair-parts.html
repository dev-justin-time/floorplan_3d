    <link rel="canonical" href="https://dev-justin-time.github.io/floorplan_3d/pages/stair-parts.html">

    <meta property="og:site_name" content="Floorplan 3D">

<link rel="stylesheet" href="../assets/tailwind.css">
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; }
        #stage { position: fixed; inset: 0; }
        #panel { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; overflow-y: auto; }
        #info { position: fixed; right: 16px; bottom: 16px; width: 280px; }
        .part-button.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.12); }
        canvas { display: block; }
    </style>
</head>
<body class="h-full text-slate-200">
    <div id="stage"></div>

    <aside id="panel" class="bg-slate-900/95 backdrop-blur border-r border-slate-700 p-4 text-sm">
        <h1 class="text-lg font-bold text-white">Stair parts</h1>
        <p class="text-[11px] text-slate-400 mt-1">Every component at its real dressed size, drawn as wireframe. Click a part to frame it.</p>
        <div class="mt-3 flex gap-2">
            <button id="fit-all" class="flex-1 rounded bg-sky-500/20 border border-sky-400/40 px-2 py-1 text-[11px] font-bold text-sky-200">Frame all</button>
            <button id="toggle-labels" class="flex-1 rounded bg-slate-800 border border-slate-600 px-2 py-1 text-[11px] font-bold text-slate-300">Labels on</button>
        </div>
        <div id="part-list" class="mt-4 space-y-4"></div>
        <p class="mt-6 text-[10px] text-slate-500">Sizes are dressed US dimensions: a 2x10 is 1½ × 9¼ in. Dimensions in the card are L × W × H.</p>
    </aside>

    <div id="info" class="rounded-xl bg-slate-900/95 backdrop-blur border border-slate-700 p-4">
        <h2 id="info-title" class="text-sm font-bold text-white">Select a part</h2>
        <p id="info-material" class="text-[11px] text-slate-400 mt-0.5"></p>
        <p id="info-size" class="text-[11px] font-mono text-sky-300 mt-2"></p>
        <p id="info-code" class="text-[10px] font-mono text-slate-500 mt-1"></p>
        <p id="info-summary" class="text-[11px] text-slate-400 mt-2 leading-snug"></p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three/three.module.js",
            "three/addons/": "/vendor/three/addons/",
            "three/nodes": "/vendor/three/addons/nodes/Nodes.js",
            "three-bvh-csg": "/vendor/three-bvh-csg/index.module.js",
            "three-mesh-bvh": "/vendor/three-mesh-bvh/index.module.js"
        }
    }
    </script>
    <script type="module" src="../assets/page-scripts/stair-parts.js"></script>
    <script type="module" src="../shared/site.js"></script>
</body>
</html>
