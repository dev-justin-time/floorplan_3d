<!doctype html>
<html>
<body>
<div id="status">starting</div>
<pre id="log"></pre>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0/es2022/three.mjs",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
    "three/nodes": "https://esm.sh/three@0.160.0/examples/jsm/nodes/Nodes.js",
    "nipplejs": "https://esm.sh/nipplejs@0.10.1?external=three"
  }
}
</script>
<script type="module">
const status = document.getElementById('status');
window.addEventListener('error', (e) => { status.textContent = 'window error: ' + e.message; });
try {
    await import('./app/js/main.js');
    status.textContent = 'imported ok';
} catch (e) {
    status.textContent = 'import error: ' + (e && (e.stack || e.message));
}
</script>
</body>
</html>
